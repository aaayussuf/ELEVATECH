<svg width="620" height="180" viewBox="0 0 620 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="evBlue" x1="25" y1="20" x2="135" y2="145" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>

    <linearGradient id="evGold" x1="70" y1="20" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7A8"/>
      <stop offset="0.35" stop-color="#FACC15"/>
      <stop offset="1" stop-color="#EAB308"/>
    </linearGradient>

    <linearGradient id="wordmark" x1="190" y1="50" x2="550" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.75" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>

    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix
        in="blur"
        type="matrix"
        values="0 0 0 0 0.05
                0 0 0 0 0.55
                0 0 0 0 1
                0 0 0 0.35 0"
      />
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="8"
        flood-color="#000000"
        flood-opacity="0.35"
      />
    </filter>
  </defs>

  <!-- EV MONOGRAM -->
  <g filter="url(#shadow)">
    <!-- E -->
    <path
      d="M28 25
         C28 18 34 12 42 12
         H105
         C113 12 119 18 119 26
         C119 34 113 40 105 40
         H57
         V66
         H97
         C105 66 111 72 111 80
         C111 88 105 94 97 94
         H57
         V121
         H105
         C113 121 119 127 119 135
         C119 143 113 149 105 149
         H42
         C34 149 28 143 28 135
         V25Z"
      fill="url(#evBlue)"
      filter="url(#glowBlue)"
    />

    <!-- V -->
    <path
      d="M91 20
         L118 20
         L144 112
         L170 20
         H197
         L160 149
         H130
         L91 20Z"
      fill="url(#evGold)"
    />

    <!-- shine -->
    <path
      d="M43 22H102"
      stroke="white"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.35"
    />
  </g>

  <!-- WORDMARK -->
  <text
    x="220"
    y="91"
    fill="url(#wordmark)"
    font-family="Arial, Helvetica, sans-serif"
    font-size="58"
    font-weight="900"
    letter-spacing="4"
  >
    ELEVA
  </text>

  <text
    x="440"
    y="91"
    fill="#FACC15"
    font-family="Arial, Helvetica, sans-serif"
    font-size="58"
    font-weight="900"
    letter-spacing="4"
  >
    TECH
  </text>

  <!-- TAGLINE -->
  <text
    x="224"
    y="124"
    fill="#94A3B8"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="700"
    letter-spacing="5"
  >
    SMARTER TECH. BETTER LIVING.
  </text>
</svg>